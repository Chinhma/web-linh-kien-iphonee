{% extends 'base.html' %}
{% load static %}
{% block content %}
<div class="container-x flex flex-col items-center py-20 text-center">
  <img src="{% static 'images/brand/logo-mark.svg' %}?v=2" alt="iParts Store" class="h-20 w-20">
  <p class="mt-6 text-6xl font-extrabold text-primary">{% block code %}{% endblock %}</p>
  <h1 class="mt-3 text-2xl md:text-3xl">{% block heading %}{% endblock %}</h1>
  <p class="mt-3 max-w-md text-muted">{% block message %}{% endblock %}</p>
  <div class="mt-8 flex flex-wrap justify-center gap-3">
    <a href="/" class="btn-primary">Về trang chủ</a>
    <a href="/tra-cuu-tuong-thich/" class="btn-secondary">Tra cứu linh kiện</a>
  </div>
</div>
{% endblock %}
