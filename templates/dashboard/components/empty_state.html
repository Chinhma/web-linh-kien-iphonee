{# Empty state trong bảng Admin. Biến: icon, title, action_url, action_text, colspan (nếu đặt trong <tr>) #}
<div class="flex flex-col items-center px-6 py-12 text-center">
  <span class="flex h-14 w-14 items-center justify-center rounded-full bg-slate-100 text-muted"><i data-lucide="{{ icon|default:'inbox' }}" class="h-7 w-7"></i></span>
  <p class="mt-3 font-semibold text-text">{{ title|default:'Chưa có dữ liệu' }}</p>
  {% if action_url %}<a href="{{ action_url }}" class="btn-primary btn-sm mt-4"><i data-lucide="plus" class="h-4 w-4"></i>{{ action_text }}</a>{% endif %}
</div>
