{# Công tắc bật/tắt ngay bằng AJAX. Biến: url_model (khóa trong toggle_field), obj, on #}
<button type="button" role="switch" aria-checked="{{ on|yesno:'true,false' }}" data-toggle-url="{% url 'dashboard:toggle_field' url_model obj.pk %}" data-field="value"
        class="relative inline-flex h-6 w-11 shrink-0 items-center rounded-full bg-slate-200 transition [&.is-on]:bg-success {% if on %}is-on{% endif %} [&.is-on>span]:translate-x-5" aria-label="Bật/tắt">
  <span class="ml-0.5 inline-block h-5 w-5 rounded-full bg-white shadow transition"></span>
</button>
