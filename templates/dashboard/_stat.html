<div class="card flex h-full items-start gap-4 p-5">
  <span class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl {{ color }}"><i data-lucide="{{ icon }}" class="h-5 w-5"></i></span>
  <div class="min-w-0">
    <div class="text-xs text-muted">{{ label }}</div>
    <div class="mt-1 truncate text-xl font-bold">{{ value }}</div>
    {% if change is not None and change != '' %}
      <div class="mt-1 flex items-center gap-1 text-xs {% if change >= 0 %}text-success{% else %}text-danger{% endif %}">
        <i data-lucide="{% if change >= 0 %}trending-up{% else %}trending-down{% endif %}" class="h-3.5 w-3.5"></i>{{ change }}% so với kỳ trước
      </div>
    {% elif sub %}<div class="mt-1 text-xs text-muted">{{ sub }}</div>{% endif %}
  </div>
</div>
