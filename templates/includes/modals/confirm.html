<div id="confirm-modal" data-modal hidden class="fixed inset-0 z-[95] flex items-center justify-center bg-slate-900/50 p-4" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
  <div class="relative w-full max-w-md rounded-modal bg-white p-6 shadow-card-hover">
    <button type="button" data-modal-close class="icon-btn absolute right-3 top-3" aria-label="Đóng"><i data-lucide="x"></i></button>
    <div class="flex gap-4">
      <span class="flex h-11 w-11 shrink-0 items-center justify-center rounded-full bg-red-100 text-danger"><i data-lucide="alert-triangle" class="h-5 w-5"></i></span>
      <div class="flex-1">
        <h2 id="confirm-title" class="text-lg font-bold" data-confirm-title>Xác nhận</h2>
        <p class="mt-1 text-sm text-muted" data-confirm-message></p>
        <div data-confirm-note-wrap hidden class="mt-3">
          <textarea data-confirm-note rows="3" maxlength="500" class="form-input" aria-label="Ghi chú"></textarea>
          <p data-confirm-note-error hidden class="form-error">Vui lòng nhập lý do.</p>
        </div>
      </div>
    </div>
    <div class="mt-6 flex justify-end gap-2">
      <button type="button" data-modal-close class="btn-secondary">Hủy bỏ</button>
      <button type="button" data-confirm-ok class="btn-danger">Đồng ý</button>
    </div>
  </div>
</div>
