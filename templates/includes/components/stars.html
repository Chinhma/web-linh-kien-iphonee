<span class="inline-flex items-center gap-0.5 text-warning" aria-label="{{ rating|floatformat:1 }} trên 5 sao">
  {% for s in rating|stars %}
    {% if s == 'full' %}
      <svg class="{{ size|default:'h-4 w-4' }}" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01z"/></svg>
    {% elif s == 'half' %}
      <svg class="{{ size|default:'h-4 w-4' }}" viewBox="0 0 24 24" aria-hidden="true"><path fill="#E2E8F0" d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01z"/><path fill="currentColor" d="M12 2v15.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01z"/></svg>
    {% else %}
      <svg class="{{ size|default:'h-4 w-4' }} text-border" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01z"/></svg>
    {% endif %}
  {% endfor %}
</span>
