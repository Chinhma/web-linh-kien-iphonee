<div class="{% if field.errors %}is-invalid{% endif %} {{ wrapper_class }}">
  {% if field.field.widget.input_type == 'checkbox' %}
    <label class="flex items-start gap-2 text-sm">{{ field }} <span>{{ label|default:field.label }}{% if extra_label %} {{ extra_label }}{% endif %}</span></label>
  {% else %}
    <label for="{{ field.id_for_label }}" class="form-label">{{ label|default:field.label }}{% if field.field.required %} <span class="text-danger">*</span>{% endif %}</label>
    {% if password %}
      <div class="relative">
        {{ field }}
        <button type="button" data-toggle-password="{{ field.id_for_label }}" class="absolute right-2 top-1/2 -translate-y-1/2 rounded p-1.5 text-muted hover:text-text" aria-label="Hiện mật khẩu"><i data-lucide="eye" class="h-4 w-4"></i></button>
      </div>
    {% else %}
      {{ field }}
    {% endif %}
  {% endif %}
  {% if field.help_text and not hide_help %}<p class="form-hint">{{ field.help_text }}</p>{% endif %}
  {% for error in field.errors %}<p class="form-error">{{ error }}</p>{% endfor %}
</div>
