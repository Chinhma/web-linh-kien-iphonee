{% extends 'accounts/_auth_base.html' %}
{% block title %}Đã gửi hướng dẫn{% endblock %}
{% block auth_content %}
<span class="flex h-14 w-14 items-center justify-center rounded-full bg-primary-light text-primary"><i data-lucide="mail-check" class="h-7 w-7"></i></span>
<h1 class="mt-4 text-2xl">Kiểm tra email của bạn</h1>
<p class="mt-2 text-sm text-muted">Nếu email tồn tại trong hệ thống, chúng tôi đã gửi hướng dẫn đặt lại mật khẩu. Liên kết có hiệu lực trong 1 giờ.</p>
<a href="{% url 'accounts:login' %}" class="btn-primary mt-6">Về trang đăng nhập</a>
{% endblock %}
