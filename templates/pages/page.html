{% extends 'base.html' %}
{% block title %}{{ page.title }}{% endblock %}
{% block content %}
<div class="container-x max-w-4xl py-6">
  {% include 'includes/components/breadcrumb.html' %}
  <article class="card p-6 md:p-10">
    <h1 class="text-2xl md:text-3xl">{{ page.title }}</h1>
    <p class="mt-2 text-xs text-muted">Cập nhật: {{ page.updated_at|d }}</p>
    <div class="prose-ip mt-6 text-[15px] leading-relaxed">{{ page.content|simple_markdown }}</div>
  </article>
</div>
{% endblock %}
